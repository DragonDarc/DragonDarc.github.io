<!DOCTYPE html>
<html lang="th">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<title>เส้นทางสู่คณะ · ม.4–6</title>
<meta name="description" content="เกมจำลองชีวิต ม.ปลาย ม.4–ม.6 จนถึง TCAS ค้นหาคณะที่ใช่">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe3; --paper:#fffdf8; --ink:#1f2a44; --muted:#6b7280; --line:#e6dccb;
  --accent:#e8a33d; --accent2:#2f6f8f; --good:#2f9e6b; --bad:#d0533f;
  --c-acad:#3d7bd9; --c-skill:#8a5cd1; --c-stat:#e07a3f; --c-pass:#e0a020;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3,.k{font-family:'Kanit',sans-serif;font-weight:500;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:22px}
.brand h1{font-size:22px}
.brand small{display:block;color:var(--muted);font-family:'Sarabun';font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip b{font-family:'Kanit';font-weight:500}
.layout{display:grid;grid-template-columns:310px 1fr;gap:16px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.side h3{font-size:15px;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.side h3:first-child{margin-top:0}
.stat{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:14px;margin:3px 0}
.bar{height:9px;background:#eee6d6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.stat .v{text-align:right;font-family:'Kanit';font-size:13px;color:var(--muted)}
.pass-row{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.pass-row .q{color:var(--muted);font-size:13px}
.main{min-height:420px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stp{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;color:var(--muted)}
.stp>span{width:22px;height:22px;border-radius:50%;background:#eee6d6;display:grid;place-items:center;font-family:'Kanit';font-size:12px;color:var(--ink)}
.stp.on{border-color:var(--accent);color:var(--ink);background:#fff8ea}.stp.on>span{background:var(--accent)}
.stp.done>span{background:var(--good);color:#fff}
.setup{display:grid;grid-template-columns:1fr 290px;gap:18px;align-items:start}
.setup-pv{position:sticky;top:12px}
.pv-head{display:flex;gap:10px;align-items:center}.pv-av{font-size:40px;width:56px;height:56px;border-radius:16px;background:#fff8ea;display:grid;place-items:center}
.pv-money{font-size:13px;color:#4b5563}.pv-h{font-size:14px;margin:10px 0 4px}
.avs{display:flex;flex-wrap:wrap;gap:8px}.av{font-size:28px;width:52px;height:52px;border-radius:14px;background:#fff;border:2px solid var(--line)}.av.sel{border-color:var(--accent);background:#fff8ea}
.alloc{display:grid;gap:6px;max-width:520px}
.arow{display:grid;grid-template-columns:100px 34px 1fr 34px 40px;gap:8px;align-items:center}
.pm{width:34px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:18px;line-height:1}
.pm:disabled{opacity:.35;cursor:not-allowed}.arow .v{font-family:'Kanit';text-align:right}
.ptleft{display:inline-block;background:#fff4d8;border-radius:10px;padding:6px 12px;margin-bottom:10px}.ptleft.done{background:#eef6f1;color:var(--good)}
.sumlist{display:grid;gap:8px;background:#f7f3ea;border-radius:14px;padding:14px 16px}
@media (max-width:860px){.setup{grid-template-columns:1fr}.setup-pv{position:static}}
.home{text-align:center;padding:30px 22px}
.home-title{font-family:'Kanit';font-weight:600;font-size:46px;line-height:1.1;margin:6px 0 4px;background:linear-gradient(90deg,var(--ink),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.home .lead{max-width:640px;margin:8px auto 16px}
.home-crew{display:flex;justify-content:center;gap:14px;margin:10px 0 18px;padding:18px 0 10px;background:linear-gradient(#bfe5fa 0 70%,#6aab4c 70%);border-radius:16px;border:2px solid var(--line)}
.home-crew img{height:96px;image-rendering:pixelated;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.home-btns{justify-content:center}
.btn.big{font-size:18px;padding:13px 26px}
.home-sec{margin-top:26px;text-align:left}.home-sec h3{font-size:18px;margin-bottom:10px;text-align:center}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.how div{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.how b{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-family:'Kanit'}
.how>div>span{font-family:'Kanit';font-weight:500}.how small{color:var(--muted);font-size:13px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.feat div{background:#f7f3ea;border-radius:14px;padding:10px;font-size:14px;color:#4b5563}.feat b{display:block;font-family:'Kanit';font-size:24px;color:var(--ink)}
@media(max-width:600px){.home-title{font-size:34px}.home-crew img{height:64px}.home-crew{gap:6px}.feat{grid-template-columns:repeat(2,1fr)}}
.layout.full{grid-template-columns:1fr;max-width:1000px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 2px 0 rgba(31,42,68,.04)}
.card h2{font-size:24px;margin-bottom:6px}
.eyebrow{font-family:'Kanit';font-size:13px;color:var(--accent2);letter-spacing:.04em;margin-bottom:4px}
.lead{color:#374151;margin:6px 0 16px}
.energy{display:flex;gap:5px;margin:4px 0 14px;flex-wrap:wrap;align-items:center}
.energy>span{width:20px;height:20px;border-radius:6px;background:#eee6d6;display:grid;place-items:center;font-size:12px}
.energy>span.on{background:var(--accent)}
.grid-act{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.act{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;transition:.15s;display:flex;gap:10px;align-items:flex-start}
.act:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.act:disabled{opacity:.42;cursor:not-allowed}
.act .ic{font-size:24px;line-height:1}
.act .t{font-family:'Kanit';font-weight:500;font-size:15px}
.act .d{font-size:12.5px;color:var(--muted);line-height:1.35}
.act .cost{font-size:12px;color:#a66a0c;font-family:'Kanit'}
.choices{display:grid;gap:10px;margin-top:8px}
.choice{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;transition:.15s}
.choice:hover:not(:disabled){border-color:var(--accent2);background:#f7fbfd}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choices.many{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.choices.many .choice{padding:10px 34px 10px 12px}
.grp{grid-column:1/-1;font-family:'Kanit';font-size:15px;margin-top:8px;color:var(--accent2)}
.trait-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}.trait-bar>span{background:#fff4d8;border-radius:10px;padding:6px 12px}
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.trait{position:relative;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px 10px 12px;text-align:left}
.trait .t{font-family:'Kanit';font-weight:500;padding-right:30px}.trait .d{font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.trait.sel{border-color:var(--accent);background:#fff8ea}.trait:disabled{opacity:.4;cursor:not-allowed}
.tcost{position:absolute;right:8px;top:8px;min-width:24px;height:24px;border-radius:12px;background:var(--ink);color:#fff;font-family:'Kanit';font-size:13px;display:grid;place-items:center;padding:0 6px}
.trait.sel .tcost{background:var(--accent);color:#2b1a00}
.choice.sel{border-color:var(--accent);background:#fff8ea}
.ck{margin-right:4px}
.multi-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;bottom:10px;margin-top:14px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.multi-bar:empty{display:none}
.multi-bar .btn:disabled{opacity:.5;cursor:not-allowed}
.choice small{display:block;color:var(--muted);font-size:13px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-family:'Kanit';font-weight:500}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.acc{background:var(--accent);color:#2b1a00}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.result{background:#f7f3ea;border-radius:14px;padding:14px 16px;margin-top:6px;white-space:pre-line}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dl{font-size:13px;border-radius:999px;padding:2px 10px;background:#eef6f1;color:var(--good);font-family:'Kanit'}
.dl.n{background:#fbeeea;color:var(--bad)}
.dl.r{background:#fff4d8;color:#8a5a00}
.log{margin-top:14px;max-height:190px;overflow:auto;font-size:14px}
.log div{padding:5px 0;border-bottom:1px dashed var(--line)}
.log div:last-child{border:0}
.big-ic{font-size:44px;line-height:1;margin-bottom:6px}
.bgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.bgopt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.bgopt.sel{border-color:var(--accent);background:#fff8ea}
.bgopt .t{font-family:'Kanit';font-weight:500}
.bgopt .d{font-size:13px;color:var(--muted)}
input[type=text]{font-family:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;width:100%;max-width:320px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:'Kanit';font-weight:500;font-size:14px;color:var(--muted)}
.grade{font-family:'Kanit';font-weight:600}
.sec{margin-top:22px}
.sec h3{font-size:18px;margin-bottom:8px}
.reco{border:2px solid var(--accent);background:#fff8ea;border-radius:16px;padding:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13.5px}
.cmp{display:grid;grid-template-columns:130px 1fr 1fr;gap:6px 10px;align-items:center;font-size:14px}
.cmp .h{font-family:'Kanit';color:var(--muted);font-size:13px}
.items li{margin:3px 0}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
details.mob summary{display:none}
.mi{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;vertical-align:-0.22em;color:var(--c,currentColor);flex:none}
.mi svg{width:100%;height:100%;fill:currentColor;display:block}
.scene-wrap{position:relative;border:3px solid var(--ink);border-radius:16px;overflow:hidden;margin-bottom:14px;background:#111;box-shadow:0 3px 0 rgba(31,42,68,.15)}
#scene{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.px-ov{position:absolute;inset:0;pointer-events:none;font-family:'Kanit',sans-serif}
.px-name{position:absolute;transform:translate(-50%,-100%);background:rgba(20,22,40,.72);color:#fff;font-size:12px;padding:0 8px;border-radius:6px;white-space:nowrap}
.px-bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);font-size:13px;padding:3px 10px;border-radius:10px;border:2px solid var(--ink);white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis}
.px-float{position:absolute;transform:translate(-50%,0);font-size:15px;font-weight:600;color:#4ef08a;text-shadow:0 1px 0 #000,0 0 3px #000,0 0 3px #000;animation:pxf 1.8s ease-out forwards;white-space:nowrap}
.px-float.n{color:#ff8a7a}.px-float.r{color:#ffd84a}
@keyframes pxf{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
.px-ticker{position:absolute;left:8px;top:6px;background:rgba(20,22,40,.6);color:#fff;font-size:12px;padding:1px 10px;border-radius:6px;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px-place{position:absolute;right:8px;top:6px;background:rgba(20,22,40,.6);color:#fff;font-size:12px;padding:1px 10px;border-radius:6px}
.look-ed{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start;margin-top:6px}
.look-big{background:linear-gradient(#bfe5fa 0 64%,#6aab4c 64%);border:2px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;height:272px;position:sticky;top:12px}
.look-big img{width:108px;image-rendering:pixelated}
.lk-row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin:6px 0}
.lk-lab{font-family:'Kanit';font-size:14px;color:var(--muted)}
.lk-ch{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw.sel{box-shadow:0 0 0 3px var(--accent)}
.lk-b{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.lk-b.sel,.lk-t.sel{border-color:var(--accent);background:#fff8ea}
.lk-t{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 4px 2px;display:flex;flex-direction:column;align-items:center;font-size:12px;width:64px}
.lk-t img{height:42px;image-rendering:pixelated}
.lk-t.full{width:92px}.lk-t.full img{height:64px}
.lk-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;border-bottom:2px solid var(--line);padding-bottom:8px}
.lk-tab{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;font-family:'Kanit';font-size:14px}
.lk-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.look-big{flex-direction:column;gap:6px}.lk-g{font-family:'Kanit';font-size:12px;background:rgba(255,255,255,.85);border-radius:8px;padding:2px 8px}
.pv-av img{height:46px;image-rendering:pixelated}
.h-av{height:1.3em;vertical-align:-0.2em;image-rendering:pixelated}
@media(max-width:600px){.px-ticker{display:none!important}.look-ed{grid-template-columns:1fr}.look-big{height:180px}.px-name,.px-ticker,.px-place{font-size:9px}.px-bubble{font-size:10px;padding:1px 6px}.px-float{font-size:11px}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{order:2}
  details.mob summary{display:block;font-family:'Kanit';cursor:pointer;margin-bottom:8px}
  .card{padding:16px}
  .card h2{font-size:21px}
}

/* ===================== Theme v2 ===================== */
:root{--bg:#f4efe6;--paper:#fffdf9;--line:#ebe2d1;--shadow:0 1px 0 rgba(31,42,68,.04),0 12px 32px -20px rgba(31,42,68,.38)}
body{background:radial-gradient(1100px 520px at 0% -8%,#fbe7c4 0,transparent 60%),radial-gradient(900px 480px at 105% 0%,#d9ebf7 0,transparent 55%),var(--bg);background-repeat:no-repeat}
.card,.panel{box-shadow:var(--shadow)}
.card{border-radius:22px}
.brand .logo{background:linear-gradient(145deg,#2c3a5c,#1f2a44);box-shadow:0 4px 12px -4px rgba(31,42,68,.5)}
.brand .logo .mi{color:#ffd36b;width:26px;height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 0 var(--line)}
.scene-wrap{border:0;box-shadow:0 0 0 3px var(--ink),0 16px 34px -18px rgba(31,42,68,.6)}
/* ปุ่ม */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:13px;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:not(.ghost):not(.acc){background:linear-gradient(180deg,#2e3d61,#1f2a44);box-shadow:0 3px 0 #10182b}
.btn.acc{background:linear-gradient(180deg,#f7bf5e,#e9a23a);color:#2b1a00;box-shadow:0 3px 0 #c6842a}
.btn.ghost{background:#fff;box-shadow:0 3px 0 var(--line)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn .mi{color:inherit}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* ไอคอนในกรอบสี */
.act .ic{font-size:0;line-height:0}
.act .ic .mi,.choice b>.mi:first-child,.bgopt .t>.mi:first-child,.trait .t>.mi:first-child,.big-ic .mi,.grp>.mi:first-child,.how>div>span>.mi:first-child,.feat .mi{background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,#fff)}
.act .ic .mi{width:44px;height:44px;padding:10px;border-radius:13px;vertical-align:0}
.choice b>.mi:first-child{width:32px;height:32px;padding:7px;border-radius:10px}
.bgopt .t>.mi:first-child,.trait .t>.mi:first-child{width:30px;height:30px;padding:6px;border-radius:9px}
.big-ic{font-size:0;line-height:0;margin-bottom:12px}
.big-ic .mi{width:62px;height:62px;padding:14px;border-radius:19px}
.grp>.mi:first-child{width:26px;height:26px;padding:5px;border-radius:8px}
.how>div>span>.mi:first-child{width:26px;height:26px;padding:5px;border-radius:8px;margin-right:4px}
/* การ์ดกิจกรรม */
.act{position:relative;border-radius:16px;padding:12px;gap:12px;align-items:center;box-shadow:0 1px 0 rgba(31,42,68,.03)}
.act:hover:not(:disabled){border-color:#e9b25a;box-shadow:0 10px 20px -14px rgba(31,42,68,.55);transform:translateY(-2px)}
.act .t{padding-right:38px;line-height:1.3}
.act .d{margin-top:2px}
.act .cost{position:absolute;top:9px;right:9px;display:inline-flex;align-items:center;gap:1px;background:#fff5dc;border:1px solid #f1d9a2;border-radius:999px;padding:0 7px 0 3px;font-size:12px;color:#8a5a00;line-height:20px}
.act .cost .mi{width:14px;height:14px}
.grid-act{gap:10px}
.grp{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin:16px 0 2px}
.grp:after{content:'';flex:1;height:1px;background:var(--line)}
/* ตัวเลือก */
.choice{position:relative;padding:12px 40px 12px 14px;border-radius:15px;box-shadow:0 1px 0 rgba(31,42,68,.03)}
.choice:after{content:'';position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid #c2b59c;border-top:2px solid #c2b59c;transform:translateY(-50%) rotate(45deg);transition:right .15s}
.choice:hover:not(:disabled):after{right:12px;border-color:var(--accent2)}
.choice b{display:flex;align-items:center;gap:9px;font-family:'Kanit';font-weight:500}
.choice:has(b>.mi:first-child) small{padding-left:41px}
.choice.sel{border-color:var(--accent);background:#fff7e6;box-shadow:0 0 0 2px #f6d79b inset}
.ck .mi{width:22px;height:22px}
/* พลังงาน */

const EMO_RE=new RegExp('('+Object.keys(EMO).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gu');
function icoHTML(e,cls=''){ const m=EMO[String(e).replace(/️/g,'')]; if(!m) return e; return `<span class="mi ${cls}" style="--c:${m[1]}" aria-hidden="true"><svg viewBox="0 -960 960 960"><path d="${MI_PATHS[m[0]]}"/></svg></span>`; }
const _tpl=document.createElement('template');
function icoEl(e){ _tpl.innerHTML=icoHTML(e); return _tpl.content.firstChild.cloneNode(true); }
const EMO_TEST=/[←-⯿☀-➿\u{1F000}-\u{1FAFF}]/u;
function iconize(root){
  if(!root) return;
  if(root.nodeType===3){ root=root.parentNode; if(!root) return; }
  if(root.nodeType!==1) return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){ const p=n.parentNode; if(!p||/^(SCRIPT|STYLE|TEXTAREA|OPTION|TITLE)$/.test(p.nodeName)||(p.closest&&p.closest('svg'))) return 2; return EMO_TEST.test(n.data)?1:2; }});
  const list=[]; while(tw.nextNode()) list.push(tw.currentNode);
  for(const n of list){
    const t=n.data.replace(/️/g,''); EMO_RE.lastIndex=0; if(!EMO_RE.test(t)) continue; EMO_RE.lastIndex=0;
    const frag=document.createDocumentFragment(); let last=0, m;
    while((m=EMO_RE.exec(t))){ if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index))); frag.appendChild(icoEl(m[0])); last=m.index+m[0].length; }
    if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    n.parentNode.replaceChild(frag,n);
  }
}

function bgBonus(k){
  const b=BACKGROUNDS[k], out=[];
  for(const [key,v] of Object.entries(b.set)){
    if(ABS.includes(key)){
      const base=BASE[key], diff=v-base; if(!diff) continue;
      const good = key==='stress'? diff<0 : diff>0;
      const show = key==='money'? `${v.toLocaleString()} บาท` : v;
      out.push({good, t:`${key==='money'?'💰 ':''}${LABEL[key]}เริ่มต้น ${show} <span style="opacity:.6">(ปกติ ${key==='money'?base.toLocaleString():base})</span>`});
    } else out.push({good:true, t:`${LABEL[key]} +${v}`});
  }
  return out;
}

function specialAction(kind, eff){
  const n=S.monthActs[kind];
  if(kind==='homework'){ S.hwDone=1; const tm=MI(S.month).term; S.hwCount=S.hwCount||{}; S.hwCount[tm]=(S.hwCount[tm]||0)+1; return 'ทำการบ้านครบทุกวิชา ส่งทันเวลา ✅ (ได้คะแนนเก็บ)'; }
  if(kind==='youtube'){
    const k=pick(ACAD); eff[k]=3; let t=`ดูคลิปติววิชา${LABEL[k]}จากช่องดัง เข้าใจกว่าในห้องอีก`;
    if(Math.random()<0.3){ const d=pick(DKEYS); eff.reveal=d; t+=`\nคลิปถัดไปเด้งขึ้นมาเป็น "วันหนึ่งของ${pick(DOM[d].job)}" เลยดูต่อจนจบ`; }
    return t;
  }
  if(kind==='game'){
    S.flags.games=(S.flags.games||0)+1;
    if(hasT('gamer')) eff.stress-=3;
    if(n>=3 && !hasT('gamer')){ eff.stress=-1; eff.health=-4; eff.rel=-2; return 'บอกตัวเองว่า "อีกตาเดียว" แต่รู้ตัวอีกทีก็ตี 3 😵\nเริ่มติดเกมแล้ว เล่นแล้วก็ไม่ได้หายเครียดเท่าไร พ่อแม่เริ่มบ่น'; }
    const x=Math.random();
    if(x<0.25){ eff.stress-=4; return 'ชนะติดกันจนแรงก์อัป! 🏆 อารมณ์ดีทั้งวัน'; }
    if(x<0.45){ eff.stress=3; return 'แพ้ติดกัน 5 ตา แถมเจอคนในเกมพิมพ์ด่า 😤 เล่นจบเครียดกว่าเดิม'; }
    if(x<0.6 && S.passion.it>=60){ eff.reveal='it'; return 'เล่นไปเล่นมาเริ่มสงสัยว่าเขาเขียนโค้ดเกมนี้ยังไง แล้วไปเปิดคลิปเบื้องหลังการสร้างเกมดู'; }
    if(x<0.7){ eff.rel=3; return 'เล่นปาร์ตี้กับเพื่อนในห้อง ตะโกนกันลั่นไมค์ สนุกมาก'; }
    return 'เล่นเกมไปสองชั่วโมง ผ่อนคลายดี';
  }
  if(kind==='social'){
    let t; let x=Math.random(); if(hasT('mediaproof') && (x>=0.3&&x<0.5 || x>=0.7)) x=Math.random()<0.5?0.1:0.6;
    if(x<0.3){ t='ไถเพลินมาก… 2 ชั่วโมงหายไปไหนไม่รู้ 🫠'; }
    else if(x<0.5){ eff.stress=4; eff.rel=0; t='เห็นเพื่อนโพสต์ไปเที่ยวต่างประเทศ อีกคนได้รางวัลระดับประเทศ แล้วรู้สึกว่าตัวเองไม่เก่งเลย 😞'; }
    else if(x<0.7){ const d=pick(DKEYS); eff.reveal=d; t=`อัลกอริทึมพาไปเจอคลิป "วันหนึ่งของ${pick(DOM[d].job)}" ดูวนไปหลายคลิป`; }
    else if(x<0.85){ eff.stress=2; eff.soc=1; t='เจอดราม่าในโซเชียล เผลอไปเถียงในคอมเมนต์ทั้งที่ไม่รู้จักใคร 🙄'; }
    else { eff.money=-250; t='เจอไลฟ์ขายของลดราคา กดสั่งไปแบบไม่ทันคิด 💸'; }
    if(n>=3){ eff.health=(eff.health||0)-3; eff.stress=(eff.stress||0)+2; t+='\n\nช่วงนี้เล่นมือถือเยอะเกินไปแล้ว ตาล้าและนอนดึกทุกคืน'; }
    return t;
  }
  return '';
}

let S = null;
const SAVE_KEY = 'careerpath_m46_v1';
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function loadSave(){ try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function newGame(su){
  setSubjects(su.prog);
  const st=buildStats(su); st.prep=0;
  const base=shuffle([r(78,92),r(66,78),r(54,65),r(44,56),r(38,50),r(30,44),r(25,40),r(20,35),r(15,30),r(12,28),r(10,25),r(8,20)]);
  const passion={}; DKEYS.forEach((d,i)=>passion[d]=base[i]);
  S={name:su.name||'นักเรียน', look:{...su.look}, bg:su.bg, prog:su.prog, traits:[...su.traits], st, passion, clarity:Object.fromEntries(DKEYS.map(d=>[d,0])),
     exposure:Object.fromEntries(DKEYS.map(d=>[d,0])), used:{}, counts:{}, flags:{}, items:[],
     month:0, steps:[], phase:'', energy:0, maxEnergy:10, club:null, ev:null, evOpts:null, result:null,
     weekendOpts:null, exams:{}, log:[], tcas:{scores:{},reg:{},ui:{}}, itemsMeta:[], clubHist:[]};
  const bg=BACKGROUNDS[su.bg]; if(bg.flag) S.flags[bg.flag]=1;
  startMonth();
}
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));

/* ===================== ระบบค่าพลัง ===================== */
function tier(p){ return p>=65?'like':p>=40?'mid':'low'; }
function hintText(d){
  const t=tier(S.passion[d]), n=DOM[d].name;
  return {
    like:`✨ รู้สึกสนุกและอยากรู้ต่อ — สาย${n}อาจเป็นทางของเรา`,
    mid:`🙂 ก็โอเคนะ ไม่ได้ตื่นเต้นมาก — สาย${n}รู้สึกเฉยๆ`,
    low:`😮‍💨 ทำไปแล้วรู้สึกฝืนๆ — สาย${n}อาจไม่ใช่เรา`
  }[t];
}
function raiseClarity(d,force){
  const before=S.clarity[d];
  S.clarity[d]=hasT('observant')?2:Math.min(2,before+1);
  if(S.clarity[d]>before) return '\n\n💡 ค้นพบความชอบ: '+hintText(d);
  return force?'\n\n💡 '+hintText(d):'';
}
function addInterest(d,pts,fromEvent){
  const t1=hasT('curious')?2:3, t2=hasT('curious')?4:6;
  const b=S.exposure[d]||0, a=b+pts; S.exposure[d]=a;
  if((b<t1&&a>=t1)||(b<t2&&a>=t2)) return {up:true,text:raiseClarity(d)};
  if(fromEvent && S.clarity[d]===0) return {up:false,text:`\n\n🔎 เริ่มรู้สึกอะไรบางอย่างกับสาย${DOM[d].name}… ลองทำอะไรเกี่ยวกับสายนี้อีกนิดจะรู้ชัดขึ้น`};
  if(fromEvent && S.clarity[d]>0) return {up:false,text:'\n\n💡 '+hintText(d)};
  return {up:false,text:''};
}
function apply(eff){
  eff=mapEff(eff,S.prog);
  const out=[]; let extra='';
  const halved = S.st.stress>=80;
  for(const [k,v0] of Object.entries(eff||{})){
    if(k==='reveal'||k==='reveal2'||k==='exp'){ const pts=k==='reveal2'?3:1; const r0=addInterest(v0,pts,k!=='exp'); extra+=r0.text; if(r0.up) out.push({k:'reveal',d:v0}); continue; }
    if(k==='item'){ S.items.push(v0); (S.itemsMeta=S.itemsMeta||[]).push({n:v0,d:eff.itemDom||null,t:eff.itemTier||1}); out.push({k:'item',v:v0}); continue; }
    if(k==='forget'){ let tot=0; ALL_SUBJ.forEach(q=>{ if(S.st[q]>BASE_ACAD){ const d=Math.round((S.st[q]-BASE_ACAD)*v0); S.st[q]-=d; if(ACAD.includes(q)) tot+=d; } }); if(tot){ out.push({k:'forget',v:tot}); extra+=`\n\n📉 ช่วงปิดเทอมไม่ได้ทบทวน ลืมบทเรียนไปบ้าง (ค่าวิชารวม −${tot})`; } continue; }
    if(k==='fac'){ S.facStack=S.facStack||{}; S.facStack[v0]=(S.facStack[v0]||0)+1; out.push({k:'fac',v:v0}); continue; }
    if(!(k in S.st)) continue;
    let v=v0;
    if(k==='stress' && v>0 && hasT('calm')) v=Math.max(1,Math.round(v*0.7));
    if(k==='money' && v>0 && hasT('merchant')) v=Math.round(v*1.5);
    if(k==='money' && v<0 && hasT('thrifty')) v=Math.round(v*0.7);
    if(halved && v>0 && (ACAD.includes(k)||SKILL.includes(k))) v=Math.max(1,Math.round(v/2));
    if(v>0 && ALL_SUBJ.includes(k)){ const cur=S.st[k]; if(cur>=90){ const x=v*0.35; v=Math.floor(x)+(Math.random()<x%1?1:0); } else if(cur>=78) v=Math.max(1,Math.round(v*0.5)); else if(cur>=62) v=Math.max(1,Math.round(v*0.75)); }
    const before=S.st[k];
    S.st[k]= k==='money'? Math.max(0,before+v) : clamp(before+v);
    const real=S.st[k]-before;
    if(real!==0) out.push({k,v:real});
  }
  return {out,extra};
}
function deltaHTML(out){
  return '<div class="deltas">'+out.map(o=>{
    if(o.k==='reveal') return `<span class="dl r">💡 ความชอบ: ${DOM[o.d].name}</span>`;
    if(o.k==='item') return `<span class="dl r">📁 ได้ชิ้นงาน: ${o.v}</span>`;
    if(o.k==='fac') return `<span class="dl r">🎯 ${o.v} +1</span>`;
    if(o.k==='forget') return `<span class="dl n">📉 ลืมบทเรียน −${o.v}</span>`;

    const val = o.k==='money' ? `${o.v>0?'+':''}${o.v.toLocaleString()} บาท` : `${o.v>0?'+':''}${o.v}`;
    return `<span class="dl ${bad?'n':''}">${STAT_IC[o.k]||''} ${LABEL[o.k]} ${val}</span>`;
  }).join('')+'</div>';
}
function contest(S,score,need,itemName,effBase,dom){

function topPassion(S){ return DKEYS.reduce((a,b)=>S.passion[a]>=S.passion[b]?a:b); }
function log(t){ S.log.unshift(`<b>${MI(S.month).name}</b> · ${t}`); S.log=S.log.slice(0,40); }

function startMonth(){
  const m=MONTHS[S.month];
  S.steps=[...m.steps];
  let e=10+(hasT('sporty')?1:0)+(hasT('earlybird')?1:0); if(S.st.health<=30) e-=3; if(S.st.stress>=80) e-=2;
  S.energy=S.maxEnergy=e;
  S.monthActs={}; S.hwDone=m.brk?1:0;
  if(!m.brk && !m.tcas){ ACAD.forEach(k=>{ if(S.st[k]<78) S.st[k]=Math.min(78,S.st[k]+2); }); }   // เรียนในห้องทุกเดือน ได้ความรู้พื้นฐานเพิ่มเล็กน้อย
  if(S.month>0){ const al=(BACKGROUNDS[S.bg]&&BACKGROUNDS[S.bg].allow)||250; S.st.money+=al; log(`💰 ได้ค่าขนมเดือนนี้ ${al} บาท`); }
  if(m.brk){ S.energy+=2; S.maxEnergy+=2; }
  try{ PX.say(`📅 ${MONTHS[S.month].name} มาแล้ว!`,2600); }catch(e){}
  nextStep();
}
function nextStep(){
  S.result=null; S.ev=null; S.evOpts=null; S.evText=null; evSel=[];
  if(!S.steps.length){
    // จบเดือน: แรงกดดันจากโรงเรียน
    apply({stress:4,health:-2,rel:-4});
    if(S.st.rel<30){ apply({stress:4}); log('😔 รู้สึกเหงา ไม่ค่อยได้คุยกับใคร (ความเครียด +4)'); }
    else if(S.st.rel>=70){ apply({stress:-3}); }
    if(S.st.stress>=95){ S.st.stress=60; S.st.health=clamp(S.st.health-12); log('😵 หมดไฟ! ล้มป่วยไปหลายวัน'); toast('หมดไฟ! ความเครียดสูงเกินไป'); }
    S.month++;
    if(S.month>=MONTHS.length){ S.phase='end'; save(); return render(); }
    return startMonth();
  }
  const step=S.steps.shift();
  if(step==='actions'){ S.phase='actions'; }
  else if(step==='weekend'){ S.phase='weekend'; const pool=WEEKENDS.filter(w=>(!w.only||w.only===S.prog) && !(w.eff.money<0 && S.st.money< -w.eff.money)); S.weekendOpts=shuffle(pool).slice(0,5).map(w=>w.id); }
  else if(step==='random'){ S.phase='event'; S.ev=pickRandomEvent(); }
  else if(step.startsWith('ev:')){ S.phase='event'; S.ev=step.slice(3); }
  else if(step.startsWith('exam:')){ S.phase='exam'; S.examType=step.slice(5); runExam(S.examType); }
  else if(step.startsWith('tcas:')){ if(S.tcas.final){ return nextStep(); } S.phase='tcas'; S.tcasStep=step.slice(5); S.tcas.ui={}; }
  save(); render();
}
function pickRandomEvent(){
  const pool=Object.entries(EVENTS).filter(([k,e])=>e.w && !S.used[k]).map(([k,e])=>[k,e.w(S)]).filter(x=>x[1]>0);
  if(!pool.length){ S.used={}; return pickRandomEvent(); }
  const tot=pool.reduce((a,x)=>a+x[1],0); let t=Math.random()*tot;
  for(const [k,w] of pool){ t-=w; if(t<=0){ S.used[k]=1; return k; } }
  const k=pool[0][0]; S.used[k]=1; return k;
}

function doAction(id){
  const a=ACTIONS.find(x=>x.id===id); if(!a||S.energy<actCost(a)) return;
  S.energy-=actCost(a);
  let eff, dom, name=a.name;
  if(id==='club'){ const c=CLUBS[S.club]; eff={...c.eff}; dom=c.dom; name=c.name; }
  else { eff={...a.eff}; dom=a.exp; }
  // ความชอบมีผลต่อความเครียด
  if(dom){ const t=tier(S.passion[dom]); eff.stress=(eff.stress||0)+(t==='like'?-2:t==='low'?2:0); eff.exp=dom; }
  // ทำซ้ำในเดือนเดียวกันได้ผลลดลง
  S.monthActs[id]=(S.monthActs[id]||0)+1;
  if(S.monthActs[id]>=3){ for(const k of Object.keys(eff)) if(typeof eff[k]==='number' && eff[k]>0 && k!=='money') eff[k]=Math.max(1,eff[k]-1); }
  S.counts[a.g==='life'?'life':(dom||'study')]=(S.counts[a.g==='life'?'life':(dom||'study')]||0)+a.cost;
  if(a.g==='study'){
    for(const k of Object.keys(eff)) if(ACAD.includes(k) && eff[k]>0){
      if(PROGRAMS[S.prog]?.focus.includes(k)) eff[k]+=1;
      if(hasT('diligent')) eff[k]+=1;
      if(hasT('genius')) eff[k]+=1;
    }
  }
  const note = a.special ? specialAction(a.special, eff) : '';
  traitAdjust(id, a.g, eff);
  const {out,extra}=apply(eff);
  const plain=out.filter(o=>o.k!=='reveal'&&o.k!=='fac'&&o.k!=='forget').map(o=>o.k==='item'?'':`${LABEL[o.k]}${o.v>0?'+':''}${o.k==='money'?o.v:o.v}`).filter(Boolean).join(', ');
  log(`${a.icon} ${name} (${plain})`);
  try{ PX.act({...(ACT_SCENE[id]||{scene:'school',pose:'idle'}), text:`${a.icon} ${name}`}, out); }catch(e){}
  if(note && a.special!=='homework'){ S.result={title:`${a.icon} ${name}`, text:(note+extra).trim(), out, back:'actions'}; }
  else if(extra){ S.result={title:`${a.icon} ${name}`, text:extra.trim(), out:out.filter(o=>o.k==='reveal'), back:'actions'}; }
  else if(note) toast(note);
  save(); render();
}
function endActions(){
  if(S.energy>0){ apply({stress:-S.energy}); log(`พักผ่อนด้วยพลังงานที่เหลือ ${S.energy} แต้ม`); }
  S.energy=0;
  if(!S.hwDone){
    const ks=shuffle(ACAD).slice(0,3), eff={stress:5}; ks.forEach(k=>eff[k]=-2);
    const {out}=apply(eff); log('📌 ไม่ได้ส่งการบ้าน โดนหักคะแนน');
    try{ PX.act({scene:'classroom',pose:'idle',text:'😱 ลืมทำการบ้าน!'}, out, 2600); }catch(e){}
    S.hwDone=1; S.result={title:'📌 ลืมทำการบ้าน!', text:`เดือนนี้ไม่ได้ทำการบ้านที่ครูสั่ง ครูวิชา${ks.map(k=>LABEL[k]).join(', ')}หักคะแนนเก็บ และสั่งงานเพิ่ม`, out};
    save(); return render();
  }
  nextStep();
}
function traitAdjust(id,g,eff){
  const social=SOCIAL_ACTS.includes(id);
  if(hasT('extrovert') && social){ eff.stress=(eff.stress||0)-3; eff.rel=(eff.rel||0)+1; }
  if(hasT('introvert')){ if(['friends','chat','club','jam','studygroup','family'].includes(id)) eff.stress=(eff.stress||0)+2; else if(!social) eff.stress=(eff.stress||0)-2; }
  if(hasT('nightowl') && ['game','social','chat','games'].includes(id) && eff.health<0) delete eff.health;
}
function doWeekend(id){

}
function chooseEvent(i){

const TERM_LV={1:5,2:19,3:25,4:28,5:30,6:34};
const needFor=t=>Math.min(100,47+(TERM_LV[t]||0));   // ค่าวิชาที่ต้องมีเพื่อได้เกรด 3 (ถ้าส่งการบ้านครบ)
function curTerm(){ for(let i=S.month;i<MONTHS.length;i++) if(MONTHS[i].term) return MONTHS[i].term; return 6; }
function gradeBadge(g){ const c=g>=3.5?'#2f9e6b':g>=2.5?'#3d7bd9':g>=1.5?'#e0a020':g>=1?'#e07a3f':'#d0533f'; return `<span class="gb" style="--g:${c}">${g}</span>`; }
function gradeOf(s){ return s>=80?4:s>=75?3.5:s>=70?3:s>=65?2.5:s>=60?2:s>=55?1.5:s>=50?1:0; }
function runExam(type){
  const res={};
  const term0=+type.replace(/\D/g,'');
  const sofar=MONTHS.slice(0,S.month+1).filter(m=>m.term===term0).length;
  const hwRatio=Math.min(1,((S.hwCount||{})[term0]||0)/Math.max(1,sofar));
  S.hwBonus=S.hwBonus||{}; S.hwBonus[type]={done:((S.hwCount||{})[term0]||0),of:sofar,pts:Math.round(10*hwRatio)};
  ACAD.forEach(k=>{
    let s=28+(S.st[k]-(TERM_LV[term0]||0))*0.68+10*hwRatio+r(-5,5);
    if(S.st.stress>=70) s-=8;
    if(hasT('quick')) s+=4;
    if(hasT('genius')) s+=6;
    if(S.st.health<40) s-=5;
    res[k]=Math.max(0,Math.min(100,Math.round(s)));
  });
  S.exams[type]=res;
  if(type.startsWith('mid')){ apply({stress:5}); }
  log(`📝 สอบ${type.startsWith('mid')?'กลางภาค':'ปลายภาค'} ${TERM_NAME(term0)}`);
}

  const cnt={}; (S.clubHist||[]).forEach(c=>cnt[c]=(cnt[c]||0)+1);
  Object.entries(cnt).forEach(([c,n])=>{ if(CLUBS[c]) L.push({id:'c'+c,n:`⭐ กิจกรรมชมรม ${CLUBS[c].name} (${n} เทอม)`,d:CLUBS[c].dom,t:n>=3?2:1}); });
  if(S.st.vol>=50) L.push({id:'vol',n:'🤝 บันทึกชั่วโมงจิตอาสา',d:'care',t:1});
  if(gpaxTerms(5)>=3.5) L.push({id:'gpa',n:'📜 เกียรติบัตรนักเรียนเรียนดี',d:null,t:2});
  return L;
}
function pfScore(f,chosen){
  let ip=0, match=0;
  chosen.forEach(it=>{ const base={3:12,2:8,1:4}[it.t]||4; const rel=it.d===f.d?1.5:(it.d==null?0.8:0.5); ip+=base*rel; if(it.d===f.d) match++; });
  ip=Math.min(40,Math.round(ip));
  const coh=chosen.length&&match/chosen.length>=0.5?10:0;
  const exp=Math.min(15,((S.facStack||{})[f.n]||0)*5);
  const g=Math.round(gpaxTerms(5)*6);
  const club=(S.club&&CLUBS[S.club]&&CLUBS[S.club].dom===f.d)?5:0;
  return {total:ip+coh+exp+g+club, ip, coh, exp, g, club, match};
}
const PF_PASS={1:45,2:58,3:75};
const PF_GPA=f=>MED4.includes(f.n)?3.5:facTier(f)===3?3.0:0;
function pfSubmit(fi,ids){
  const f=facByIdx(fi), cand=pfCandidates(), chosen=cand.filter(c=>ids.includes(c.id)).slice(0,10);
  const sc=pfScore(f,chosen); const fee=500;
  apply({money:-fee});
  const gpa=gpaxTerms(5), gNeed=PF_GPA(f);
  S.tcas.pf={fi, ids, sc, gpa, gNeed, gpaOk:gpa>=gNeed, pass:sc.total>=PF_PASS[facTier(f)]&&gpa>=gNeed, need:PF_PASS[facTier(f)]};
  log(`📁 ยื่น Portfolio ${f.n} (คะแนนแฟ้ม ${sc.total}/${S.tcas.pf.need})`);
}
const IV_OPTS=[
  {t:'เล่าจากประสบการณ์จริงที่เคยได้ลองทำ', need:f=>((S.facStack||{})[f.n]||0)>0||(S.itemsMeta||[]).some(it=>it.d===f.d), why:'ต้องเคยสำรวจคณะนี้ หรือมีผลงานตรงสาย', b:18},
  {t:'ตอบตามที่เตรียมมาจากอินเทอร์เน็ต', need:()=>true, b:6},
  {t:'ตอบตรงๆ ว่าพ่อแม่อยากให้เรียน', need:()=>true, b:-8}
];
function pfInterview(oi){
  const f=facByIdx(S.tcas.pf.fi), o=IV_OPTS[oi];
  const sc=Math.round(S.st.comm*0.4+S.passion[f.d]*0.3+o.b+(S.flags.tcasPlan?5:0)+r(-6,6));
  const need=facTier(f)===3?56:45;
  S.tcas.pf.iv={oi,sc,need,pass:sc>=need};
  if(S.tcas.pf.iv.pass){ S.tcas.pf.admitted=true; log(`🎉 ผ่านสัมภาษณ์ ${f.n} รอบ Portfolio!`); } else log(`😣 ไม่ผ่านสัมภาษณ์ ${f.n}`);
}
function tcasConfirm(fac,round){ S.tcas.final={fac,round}; log(`🎓 ยืนยันสิทธิ์ ${fac} (${round})`); try{ PX.act({scene:'park',pose:'cheer',friends:2,text:`🎉 ติด${fac}!`},[],4000); }catch(e){} }

/* ---------- สมัครสอบ ---------- */
function examRegister(list){
  const fee=list.reduce((a,k)=>a+EXAMS[k].fee,0);
  apply({money:-fee,stress:4});
  list.forEach(k=>{ S.tcas.reg[k]=1; S.tcas.scores[k]=examScore(k); });
  log(`📝 สอบ ${list.map(k=>EXAMS[k].short).join(', ')} (ค่าสมัคร ${fee} บาท)`);
}
function askMoney(){ S.tcas.asked=(S.tcas.asked||0)+1; apply({money:600,rel:-4}); log('💰 ขอเงินที่บ้านค่าสมัครสอบ 600 บาท'); }

/* ---------- Quota / Admission / Direct ---------- */
function quotaSubmit(fis){
  apply({money:-300});
  const res=fis.map(fi=>{ const f=facByIdx(fi), miss=missingExams(f), elig=hasEvidence(f), sc=facScore(f)+2, cut=facCut(f);
    return {fi, sc:Math.round(sc*10)/10, cut, miss, elig, pass:elig&&!miss.length&&sc>=cut}; });
  S.tcas.quota={res, admitted:res.find(x=>x.pass)?.fi};
  log(`📨 ยื่นรอบ Quota ${fis.length} คณะ`);
}
function admSubmit(fis){
  apply({money:-350});
  const res=fis.map(fi=>{ const f=facByIdx(fi), miss=missingExams(f), sc=facScore(f), cut=facCut(f)+r(-2,2);
    return {fi, sc, cut, miss, pass:!miss.length&&sc>=cut}; });
  S.tcas.adm={res, admitted:res.find(x=>x.pass)?.fi};
  log(`📨 ยื่นรอบ Admission ${fis.length} อันดับ`);
}
function directOffers(){
  if(S.tcas.directOffers) return S.tcas.directOffers;
  const pool=shuffle(FACULTIES.map((f,i)=>i).filter(i=>facTier(FACULTIES[i])<=2)).slice(0,6);
  S.tcas.directOffers=pool.map(fi=>{ const f=facByIdx(fi), cut=facCut(f)-10, sc=facScore(f), miss=missingExams(f); return {fi,cut,sc,miss,pass:!miss.length&&sc>=cut}; });
  return S.tcas.directOffers;
}
function gapYear(){ S.tcas.final={gap:true}; log('🧭 เลือก Gap Year เพื่อค้นหาตัวเองและเตรียมสอบใหม่'); }

/* ---------- ตัวช่วยอัตโนมัติ (ใช้ทดสอบ) ---------- */
function bestFacs(n){
  const apt=aptitude();
  return FACULTIES.map((f,i)=>({i,f,v:apt[f.d]*0.5+S.passion[f.d]*0.5+((S.facStack||{})[f.n]||0)*3})).sort((a,b)=>b.v-a.v).slice(0,n);
}
function tcasAuto(){
  const st=S.tcasStep, T=S.tcas;
  if(st==='portfolio'){
    if(!T.pf){ const f=bestFacs(1)[0]; const fi=f.i; const cand=pfCandidates().sort((a,b)=>((b.d===f.f.d)*2+b.t)-((a.d===f.f.d)*2+a.t)); pfSubmit(fi,cand.slice(0,10).map(c=>c.id)); return; }
    if(T.pf.pass&&!T.pf.iv){ const f=facByIdx(T.pf.fi); const oi=IV_OPTS.findIndex(o=>o.need(f)); pfInterview(oi<0?1:oi); return; }
    if(T.pf.admitted&&!T.final&&!T.pf.declined){ if(Math.random()<0.6) tcasConfirm(facByIdx(T.pf.fi).n,'รอบ 1 Portfolio'); else T.pf.declined=true; return; }
    return tcasDone();
  }
  if(st==='tgat'||st==='alevel'){
    if(!T.ui.done){ const want=new Set(); bestFacs(4).forEach(x=>Object.keys(facWeights(x.f)).forEach(k=>want.add(k)));
      const list=[...want].filter(k=>(st==='tgat'?TGAT_TPAT:ALEVELS).includes(k)&&!T.reg[k]);
      let money=S.st.money; const ok=[]; list.forEach(k=>{ if(money>=EXAMS[k].fee){ ok.push(k); money-=EXAMS[k].fee; } });
      if(ok.length) examRegister(ok); T.ui.done=true; return; }
    return tcasDone();
  }
  if(st==='quota'){ if(!T.quota){ const c=bestFacs(8).filter(x=>hasEvidence(x.f)).slice(0,3).map(x=>x.i); if(c.length) quotaSubmit(c); else { T.quota={res:[],skipped:true}; } return; }
    if(T.quota.admitted!=null&&!T.final){ tcasConfirm(facByIdx(T.quota.admitted).n,'รอบ 2 Quota'); return; } return tcasDone(); }
  if(st==='admission'){ if(!T.adm){ const c=bestFacs(12).sort((a,b)=>(facScore(b.f)-facCut(b.f))-(facScore(a.f)-facCut(a.f))).slice(0,5).map(x=>x.i); admSubmit(c); return; }
    if(T.adm.admitted!=null&&!T.final){ tcasConfirm(facByIdx(T.adm.admitted).n,'รอบ 3 Admission'); return; } return tcasDone(); }
  if(st==='direct'){ if(!T.final){ const o=directOffers().find(x=>x.pass); if(o) tcasConfirm(facByIdx(o.fi).n,'รอบ 4 Direct Admission'); else gapYear(); return; } return tcasDone(); }
  return tcasDone();
}

function renderSide(){

  const bar=(k,c)=>`<div class="stat"><span>${STAT_IC[k]||''} ${LABEL[k]}</span><div class="bar">${ACAD.includes(k)?`<b class="lv" style="left:${lvNeed}%"></b>`:''}<i style="width:${S.st[k]}%;background:${ACAD.includes(k)&&S.st[k]<lvNeed?'#e0a020':c}"></i></div><span class="v">${S.st[k]}</span></div>`;

    else right=`<div class="bar"><i style="width:${p}%;background:var(--c-pass)"></i></div>`;
    return `<div class="pass-row"><span>${DOM[d].icon} ${DOM[d].name.split('/')[0]}</span>${right}</div>`;
  }).join('');
  const inner=`<div class="sp-stats">
    <h3>📘 วิชาการ</h3><div class="note" style="margin:-2px 0 6px">ขีดดำ = เกณฑ์เกรด 3 ของ ${TERM_NAME(curTerm())} (${lvNeed}) · แถบสีเหลือง = ยังต่ำกว่าเกณฑ์</div>${ACAD.map(k=>bar(k,'var(--c-acad)')).join('')}
    <h3>🛠️ ทักษะ</h3>${SKILL.map(k=>bar(k,'var(--c-skill)')).join('')}
    <h3>❤️ สถานะ</h3>${bar('stress',S.st.stress>=70?'var(--bad)':'var(--c-stat)')}${bar('health','var(--good)')}${bar('rel','#d76aa0')}${MI(S.month).y>=5?`${bar('prep','#7b5cd6')}<div class="note" style="margin:2px 0 0">เพิ่มจากตะลุยข้อสอบเก่า · เรียนพิเศษ · สอบ Mock · คอร์สติว (ช่วยคะแนน TGAT/TPAT/A-Level สูงสุด +20)</div>`:''}
    </div><div class="sp-pass"><h3>🔍 ความชอบ (ค้นหาจากการลงมือทำ)</h3>${pass}
    ${S.facStack&&Object.keys(S.facStack).length?`<h3>🎯 คณะที่สนใจ</h3><div style="font-size:13px">${Object.entries(S.facStack).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([n,c])=>`• ${n} <b>×${c}</b>`).join('<br>')}</div>`:''}
    ${S.items.length?`<h3>📁 ชิ้นงาน Portfolio (${S.items.length})</h3><div style="font-size:13px">${S.items.map(i=>'• '+i).join('<br>')}</div>`:''}</div>`;
  side.innerHTML=`<details class="mob" open><summary>📊 ค่าพลังของ ${esc(S.name)}</summary><div class="pv-head" style="margin-bottom:8px"><div class="pv-av" style="font-size:30px;width:46px;height:46px"><img src="${PX.avatarURL(S.look,3,true)}" alt=""></div><div><div class="k">${esc(S.name)}</div><div class="note" style="margin:0">${PROGRAMS[S.prog]?PROGRAMS[S.prog].name:''} · ${(S.traits||[]).map(t=>TRAITS[t]?TRAITS[t].icon:'').join(' ')}</div></div></div>${inner}</details>`;

function renderChips(){
  const c=$('#chips');
  if(!S||S.phase==='end'||S.phase==='start'){ c.innerHTML=''; return; }
  c.innerHTML=`<span class="chip">📅 <b>${MONTHS[S.month].name}</b> · ${termLabel(S.month)}</span>
    <span class="chip">💰 <b>${S.st.money.toLocaleString()}</b> บาท</span>
    ${S.club?`<span class="chip">${CLUBS[S.club].icon} ${CLUBS[S.club].name}</span>`:''}`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function sceneSync(){
  document.querySelector('.scene-wrap').style.display = S ? '' : 'none';
  if(!S){ const su=SU; if(su){ PX.setLook(su.look); PX.setName(su.name||'ตัวละครของคุณ','ม.4'); } PX.setBase({scene:'park',pose:'idle'}); PX.ticker(''); return; }
  PX.setLook(S.look); PX.setName(S.name, PROGRAMS[S.prog]?PROGRAMS[S.prog].name:'ม.4');
  let b={scene:'school',pose:'idle'};
  if(S.phase==='weekend') b={scene:'park',pose:'idle'};
  else if(S.phase==='event' && S.ev) b={pose:'idle',...(EV_SCENE[S.ev]||{scene:'school'})};
  else if(S.phase==='exam') b={scene:'classroom',pose:'sit'};
  else if(S.phase==='tcas') b=({portfolio:{scene:'bedroom',pose:'sit',spot:'desk'},tgat:{scene:'classroom',pose:'sit'},alevel:{scene:'classroom',pose:'sit'}})[S.tcasStep]||{scene:'bedroom',pose:'phone'};
  else if(S.phase==='end') b=(S.tcas&&S.tcas.final&&S.tcas.final.fac)?{scene:'stage',pose:'cheer',friends:2}:{scene:'park',pose:'idle',friends:2};
  PX.setBase(b);
  PX.ticker(S.log[0]?S.log[0].replace(/<[^>]+>/g,''):'');
}
function render(){
  renderChips(); renderSide();
  try{ sceneSync(); }catch(e){ console.warn(e); }
  const m=$('#main');
  if(!S){ return SU ? renderStart(m) : renderHome(m); }
  if(S.result){ return renderResult(m); }
  if(S.phase==='actions') return renderActions(m);
  if(S.phase==='weekend') return renderWeekend(m);
  if(S.phase==='event') return renderEvent(m);
  if(S.phase==='exam') return renderExam(m);
  if(S.phase==='tcas') return renderTcas(m);
  if(S.phase==='end') return renderEnd(m);
}

  </div>`;
  if(E.multi){

function aptitude(){
  const s=S.st, sm=S.prog==='scimath';
  const sci = sm ? (s.sci+s.phy+s.chem+s.bio)/4 : s.sci;
  const bio = sm ? (s.bio*2+s.sci)/3 : s.sci, phy = sm ? (s.phy*2+s.sci)/3 : s.sci, chem = sm ? (s.chem*2+s.sci)/3 : s.sci;
  const art = sm ? s.arts : s.art, mus = sm ? s.arts : s.music;
  const eng = sm ? s.eng : (s.eng*2+s.eng2)/3;
  return {
    health:(bio*2+chem+s.math+eng+s.vol)/6,
    science:(sci*2+chem+bio+s.math+s.work)/6,
    engi:(s.math*2+phy*2+s.hands+s.work)/6,
    it:(s.math*2+s.com*3+s.create)/6,
    biz:(s.math*2+eng+s.chi+s.comm*2)/6,
    design:(art*3+s.create*2+s.math)/6,
    media:(s.create*2+s.comm*2+art+s.com)/6,
    perf:(mus*3+s.create+s.comm+s.health)/6,
    edu:(s.comm*2+s.vol*2+s.thai+eng)/6,
    law:(s.thai*2+s.soc*2+s.comm*2)/6,
    lang:(s.thai+eng*2+s.chi*2+s.comm)/6,
    care:(s.soc*2+s.comm*2+s.vol*2)/6
  };
}

  const REACTS=['👍','🔥','💪','🎉','❤','😆'];

  let room=null;                // {code,players,feed,seq,rxSince,first,open,now}
  let pollT=null, polling=false, lastPoll=0, sending=false;

  /* ---------- เรียกเซิร์ฟเวอร์ ---------- */
  function call(fn,...args){
    if(!gas()&&avail()){
      const ac=window.AbortController?new AbortController():null, t=setTimeout(()=>ac&&ac.abort(),25000);
      return fetch(API(),{method:'POST',body:JSON.stringify({fn,args}),signal:ac?ac.signal:undefined})
        .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(v=>{ clearTimeout(t); v=v||{ok:false,err:'ไม่มีข้อมูลตอบกลับ'}; if(v.ok===false&&v.err==='AUTH') expire(); return v; })
        .catch(e=>{ clearTimeout(t); throw (e&&e.name==='AbortError')?new Error('หมดเวลาเชื่อมต่อ'):e; });
    }
    return new Promise((res,rej)=>{
      if(!avail()) return rej(new Error('offline'));
      let done=false; const t=setTimeout(()=>{ if(!done){ done=true; rej(new Error('หมดเวลาเชื่อมต่อ')); } },25000);
      google.script.run
        .withSuccessHandler(v=>{ if(done) return; done=true; clearTimeout(t); v=v||{ok:false,err:'ไม่มีข้อมูลตอบกลับ'}; if(v.ok===false&&v.err==='AUTH') expire(); res(v); })
        .withFailureHandler(e=>{ if(done) return; done=true; clearTimeout(t); rej(e instanceof Error?e:new Error(String(e))); })[fn](...args);
    });

  /* ---------- เข้าสู่ระบบ ---------- */
  function loginUI(after){

    };

  }

  function accountUI(){

  /* ---------- เซฟบนคลาวด์ ---------- */
  function offerCloud(){
    if(!cloud||cloud.ended) return false;
    const local=S||loadSave();
    if(S&&S.phase!=='end'){
      const m=modal(`<h2>☁ พบเซฟบนคลาวด์</h2><p class="lead" style="margin:6px 0">${esc(cloud.label)} · บันทึก${ago(cloud.savedAt)}</p>
        <p class="note">ตอนนี้กำลังเล่น <b>${esc(S.name)}</b> (${esc(termLabel(S.month))}) อยู่ในเครื่องนี้ จะใช้เกมไหนต่อ?</p>
        <div class="row"><button class="btn acc" id="cLoad">☁ โหลดเซฟจากคลาวด์</button><button class="btn" id="cKeep">เล่นเกมในเครื่องนี้ต่อ (บันทึกทับคลาวด์)</button></div>`);
      m.querySelector('#cLoad').onclick=e=>loadCloud(e.currentTarget);
      m.querySelector('#cKeep').onclick=()=>{ closeModal(); queueSave(); };
      return true;
    }
    const m=modal(`<h2>☁ พบเซฟบนคลาวด์</h2><p class="lead" style="margin:6px 0">${esc(cloud.label)} · บันทึก${ago(cloud.savedAt)}</p>

      <div class="row"><button class="btn acc" id="cLoad">☁ เล่นต่อจากคลาวด์</button><button class="btn ghost" data-close>ไว้ทีหลัง</button></div>`);
    m.querySelector('#cLoad').onclick=e=>loadCloud(e.currentTarget);
    return true;

  function loadCloud(btn){
    if(!me) return loginUI();
    busy(btn,true,'กำลังโหลด…');
    call('apiLoad',me.token).then(r=>{
      busy(btn,false);
      if(!r.ok) return toast(r.err);
      let data; try{ data=JSON.parse(r.data); }catch(e){ return toast('เซฟเสียหาย โหลดไม่ได้'); }
      if(data.st&&data.st.prep==null) data.st.prep=0;
      S=data; SU=null; setSubjects(S.prog); lastSent=r.data; cloud={savedAt:r.savedAt,label:r.label,ended:r.ended};
      try{ localStorage.setItem(SAVE_KEY,r.data); }catch(e){}
      closeModal(); render(); window.scrollTo(0,0); toast('โหลดเซฟจากคลาวด์แล้ว ☁');
    }).catch(e=>{ busy(btn,false); toast('โหลดไม่ได้: '+e.message); });
  }
  function queueSave(){ if(!me||!S||!avail()) return; clearTimeout(saveT); saveT=setTimeout(pushSave,2500); }
  function pushSave(){
    if(!me||!S) return;
    if(inflight){ pending=true; return; }
    let data=JSON.stringify(S);
    if(data===lastSent) return;
    if(data.length>48000){ const c=JSON.parse(data); c.log=(c.log||[]).slice(0,10); data=JSON.stringify(c); }
    const ended=S.phase==='end';
    const label=`${S.name} · ${ended?'จบเกมแล้ว':termLabel(S.month)+' · '+MI(S.month).name}`;
    inflight=true; saveState='saving'; paintChip();
    call('apiSave',me.token,data,label,ended).then(r=>{
      inflight=false;
      if(r.ok){ lastSent=data; saveState='ok'; cloud={savedAt:r.savedAt,label,ended}; }
      else { saveState='err'; }
      paintChip(); if(pending){ pending=false; queueSave(); }
    }).catch(()=>{ inflight=false; saveState='err'; paintChip(); setTimeout(queueSave,15000); });
  }

  /* ---------- ห้องเล่นพร้อมกัน ---------- */
  function roomUI(){
    if(!me) return loginUI(roomUI);
    if(room){
      const m=modal(`<h2>👥 ห้องเล่นพร้อมกัน</h2><p class="note" style="margin:0">บอกรหัสนี้ให้เพื่อน แล้วให้เพื่อนกด “ห้องเล่นพร้อมกัน” ใส่รหัส</p>

        <div class="row"><button class="btn acc" data-close>เล่นต่อ</button><button class="btn" id="rBoard">🏆 อันดับในห้อง</button><button class="btn ghost" id="rLeave">🚪 ออกจากห้อง</button></div>`);
      m.querySelector('#rBoard').onclick=()=>boardUI(room.code);
      m.querySelector('#rLeave').onclick=()=>{ leaveRoom(); closeModal(); };
      return;
    }
    const m=modal(`<h2>👥 ห้องเล่นพร้อมกัน</h2>
      <p class="note" style="margin:0">เข้าห้องเดียวกับเพื่อนทั้งห้องเรียน แล้วต่างคนต่างเล่นเกมของตัวเอง แต่จะเห็นกันว่าใครอยู่ตรงไหน ใครชนะการแข่งขัน ใครติดคณะอะไร</p>
      <div class="fld"><label for="rc">มีรหัสห้องแล้ว</label><input id="rc" class="pin" maxlength="4" placeholder="ABCD" autocomplete="off" style="text-transform:uppercase"></div>
      <div class="net-err" id="re"></div>
      <div class="row"><button class="btn acc" id="rJoin">เข้าห้อง →</button><span class="note" style="margin:0 6px">หรือ</span><button class="btn" id="rNew">➕ สร้างห้องใหม่</button></div>`);
    const rc=m.querySelector('#rc'), re=m.querySelector('#re'); rc.focus();
    rc.oninput=()=>{ rc.value=rc.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4); };
    const join=()=>{ if(rc.value.length<4) return re.textContent='รหัสห้องมี 4 ตัว'; const b=m.querySelector('#rJoin'); busy(b,true);
      call('apiRoomJoin',me.token,rc.value).then(r=>{ busy(b,false); if(!r.ok) return re.textContent=r.err; enterRoom(r.code); closeModal(); toast(`เข้าห้อง ${r.code} แล้ว 👥`); }).catch(e=>{ busy(b,false); re.textContent='เชื่อมต่อไม่ได้: '+e.message; }); };
    m.querySelector('#rJoin').onclick=join; rc.onkeydown=e=>{ if(e.key==='Enter') join(); };
    m.querySelector('#rNew').onclick=e=>{ const b=e.currentTarget; busy(b,true);
      call('apiRoomCreate',me.token).then(r=>{ busy(b,false); if(!r.ok) return re.textContent=r.err; enterRoom(r.code); roomUI(); }).catch(x=>{ busy(b,false); re.textContent='เชื่อมต่อไม่ได้: '+x.message; }); };

  function enterRoom(code){
    const op=ss.get(RK+'_open');
    room={code,players:[],feed:[],seq:0,rxSince:0,first:true,open:op==null?window.innerWidth>860:!!op,now:Date.now()};
    ss.set(RK,code); startPoll(); paintDock(true);
  }
  function leaveRoom(silent){
    stopPoll(); room=null; ss.set(RK,null);
    const d=document.getElementById('netdock'); if(d) d.remove(); document.body.classList.remove('has-dock');
    if(!silent) toast('ออกจากห้องแล้ว');
  }
  function presence(){
    if(!S) return {look:SU?SU.look:null, ch:SU?SU.name:'', st:SU?'กำลังสร้างตัวละคร':'หน้าหลัก', ph:'home'};
    const F=S.tcas&&S.tcas.final;
    let g=0; try{ g=gpaxTerms(6)||0; }catch(e){}
    return {look:S.look, ch:S.name, pg:PROGRAMS[S.prog]?PROGRAMS[S.prog].name:'', st:S.phase==='end'?'จบเกมแล้ว':termLabel(S.month), mo:MI(S.month).name,
      g:Math.round(g*100)/100, f:foundN(), it:(S.itemsMeta||[]).length, fac:F?(F.fac||'Gap Year'):'', dn:S.phase==='end', ph:S.phase||''};
  }
  const foundN=()=>S?DKEYS.filter(d=>S.clarity[d]>0).length:0;
  function startPoll(){
    stopPoll();
    const tick=async()=>{
      if(!room||!me||polling) return;
      polling=true; lastPoll=Date.now();
      try{
        const r=await call('apiPoll',me.token,room.code,presence(),room.seq,room.rxSince);
        if(!room) { polling=false; return; }
        if(r.ok) handle(r);
        else if(r.err==='ROOM'){ toast('ห้องนี้หมดอายุแล้ว'); leaveRoom(true); }
        room&&(room.err=!r.ok);
      }catch(e){ if(room) room.err=true; }
      polling=false; paintDock();
    };
    tick();
    pollT=setInterval(()=>{ const gap=document.hidden?30000:room&&room.open?5000:10000; if(Date.now()-lastPoll<gap-500) return; tick(); },2500);
  }
  function stopPoll(){ if(pollT) clearInterval(pollT); pollT=null; }
  const FEED_TXT={
    join:x=>`👋 <b>${esc(x.n)}</b> เข้าห้อง`,
    start:x=>`▶ <b>${esc(x.n)}</b> เริ่มเกมใหม่${x.d?` (${esc(x.d)})`:''}`,
    win:x=>`🥇 <b>${esc(x.n)}</b> ชนะเลิศ ${esc(x.d)}!`,
    burn:x=>`😵 <b>${esc(x.n)}</b> หมดไฟ! ส่งกำลังใจหน่อย`,
    gpa:x=>`📜 <b>${esc(x.n)}</b> ได้เกรดเฉลี่ย ${esc(x.d)}`,
    tcas:x=>`🎓 <b>${esc(x.n)}</b> ติด ${esc(x.d)}!`,
    gap:x=>`🧭 <b>${esc(x.n)}</b> เลือก Gap Year`,
    end:x=>`🏁 <b>${esc(x.n)}</b> จบเกมแล้ว${x.d?` · ${esc(x.d)}`:''}`
  };
  const feedText=x=>(FEED_TXT[x.k]||(()=>esc(x.n)))(x);
  function handle(r){
    room.now=r.now; room.players=r.players||[];
    const fresh=(r.feed||[]).filter(x=>x.s>room.seq);
    room.feed=room.feed.concat(fresh).slice(-30); room.seq=Math.max(room.seq,r.seq||0);
    if(!room.first){
      const mine=fresh.filter(x=>x.i!==me.id&&x.k!=='join');
      if(mine.length){ const t=document.createElement('div'); t.innerHTML=feedText(mine[mine.length-1]); toast(t.textContent); }
    }
    const rx=r.rx||[];
    if(rx.length){
      if(!room.first){ const last=rx[rx.length-1]; try{ PX.say(`${last.n} ส่ง ${last.e} ให้!`,3500); }catch(e){} toast(`${last.n} ส่ง ${last.e} ให้คุณ!`); }
      room.rxSince=Math.max(room.rxSince,...rx.map(x=>x.t));
    }
    room.first=false;
  }
  const isOn=p=>room&&room.now-p.t<20000;
  function friendsOnline(){ return room&&me?room.players.filter(p=>p.id!==me.id&&isOn(p)).length:0; }

  function roomBodyHTML(){
    const ps=[...room.players].sort((a,b)=>(b.id===me.id)-(a.id===me.id)||isOn(b)-isOn(a)||(b.dn-a.dn)||String(a.n).localeCompare(String(b.n),'th'));
    const fo=friendsOnline();
    return `<div class="dock-top"><div><div class="note" style="margin:0">รหัสห้อง</div><div class="code">${esc(room.code)}</div></div>
        <div class="row" style="gap:6px;margin:0"><button class="btn ghost dk-board" title="อันดับในห้อง">🏆</button><button class="btn ghost dk-menu" title="ตั้งค่าห้อง">⚙</button></div></div>
      ${room.err?'<div class="net-err">⚠ เชื่อมต่อไม่ได้ชั่วคราว กำลังลองใหม่…</div>':''}
      ${fo?`<div class="dock-bonus">🤝 มีเพื่อนออนไลน์ ${fo} คน · เที่ยว/แชท/ติวกับเพื่อน ได้ความสัมพันธ์ +2 และเครียด −1</div>`:''}
      <h4>👥 ในห้อง ${room.players.length} คน</h4>
      ${ps.length?ps.map(playerRow).join(''):'<div class="note">กำลังโหลด…</div>'}
      <h4>📣 ความเคลื่อนไหว</h4>
      <div class="feed">${room.feed.length?room.feed.slice().reverse().slice(0,15).map(x=>`<div>${feedText(x)} <small>${ago(x.t)}</small></div>`).join(''):'<div class="note" style="margin:0">ยังไม่มีอะไรเกิดขึ้น</div>'}</div>`;

  function bindRoom(el){
    const b1=el.querySelector('.dk-board'); if(b1) b1.onclick=()=>boardUI(room.code);

  const onlineN=()=>room?room.players.filter(isOn).length:0;
  function paintDock(force){
    if(!room||!me){ const d=document.getElementById('netdock'); if(d) d.remove(); document.body.classList.remove('has-dock'); if(typeof MOB!=='undefined') MOB.onRoom(); return; }
    let d=document.getElementById('netdock');
    if(!d){ d=document.createElement('div'); d.id='netdock'; d.className='dock'; document.body.appendChild(d);
      d.addEventListener('pointerdown',()=>{ d._busy=Date.now()+900; },true); }
    document.body.classList.add('has-dock');
    if(typeof MOB!=='undefined') MOB.onRoom();
    if(!force&&d.innerHTML&&Date.now()<(d._busy||0)){ clearTimeout(d._rt); d._rt=setTimeout(()=>paintDock(),950); return; }
    const body=d.querySelector('.dock-body'), st=body?body.scrollTop:0;

  /* ---------- กระดานอันดับ ---------- */
  const CATS={score:['⭐','คะแนนรวม',v=>Math.round(v)], gpax:['🎓','GPAX',v=>(+v).toFixed(2)], found:['🔍','ความชอบที่ค้นพบ',v=>`${v}/12`], items:['📁','ผลงาน',v=>`${v} ชิ้น`]};
  function boardUI(scope){

      <div class="lb-tabs" id="lbS"></div><div class="lb-tabs" id="lbC"></div>
      <div class="lb-list" id="lbL"><p class="note">กำลังโหลด…</p></div>
      <p class="note">⭐ คะแนนรวม = GPAX×100 + ความชอบที่ค้นพบ×15 + ผลงาน×4 (นับสูงสุด 20 ชิ้น) + คณะที่ติด (แข่งขันน้อย 40 · ปานกลาง 70 · สูงมาก 100) + 30 ถ้าคณะตรงกับความชอบ · นับผลที่ดีที่สุดของแต่ละคน</p>`,true);
    const paintTabs=()=>{

      m.querySelector('#lbC').innerHTML=Object.entries(CATS).map(([k,c])=>`<button data-c="${k}" class="${st.cat===k?'on':''}">${c[0]} ${c[1]}</button>`).join('');
      m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ st.scope=b.dataset.s; load(); });
      m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ st.cat=b.dataset.c; load(); });
    };
    const row=(x,rank)=>{ const c=CATS[st.cat];
      return `<div class="lb-row ${me&&x.id===me.id?'me':''}"><div class="rk ${rank<=3?'g'+rank:''}">${rank<=3?'🏆':''}${rank}</div><div class="av">${avatar(x.look)}</div>

    const load=()=>{
      paintTabs(); const L=m.querySelector('#lbL'); L.innerHTML='<p class="note">กำลังโหลด…</p>';

        if(!r.top.length){ L.innerHTML='<p class="note">ยังไม่มีใครส่งผล เล่นให้จบแล้วมาเป็นคนแรกกัน!</p>'; return; }
        const inTop=r.me&&r.me.rank<=r.top.length;
        L.innerHTML=r.top.map((x,i)=>row(x,i+1)).join('')+(r.me&&!inTop?`<div class="lb-me">${row(r.me,r.me.rank)}</div>`:'')+`<p class="note" style="margin:6px 0 0">ทั้งหมด ${r.total} คน${me&&!r.me?' · คุณยังไม่มีผลในกระดานนี้':''}</p>`;
      }).catch(e=>{ L.innerHTML=`<p class="net-err">โหลดไม่ได้: ${esc(e.message)}</p>`; });

  /* ---------- จบเกม ---------- */
  function endInfo(){
    const terms=[1,2,3,4,5,6].filter(t=>S.exams['final'+t]);
    const gpax=terms.length?terms.reduce((a,t)=>a+ACAD.reduce((x,k)=>x+gradeOf(S.exams['final'+t][k]),0)/ACAD.length,0)/terms.length:0;
    const F=S.tcas&&S.tcas.final, ff=F&&F.fac?facByName(F.fac):null;
    return {gpax:Math.round(gpax*100)/100, found:foundN(), items:(S.itemsMeta||[]).length, tier:ff?facTier(ff):0, fac:ff?ff.n:'', round:ff?F.round:'',
      prog:PROGRAMS[S.prog]?PROGRAMS[S.prog].name:'', match:!!(ff&&S.passion[ff.d]>=65), look:S.look};
  }
  function endHTML(){
    if(!avail()) return '';
    if(!me) return `<div class="net-end" id="netEnd">🏆 <b>เข้าสู่ระบบ</b> เพื่อส่งผลขึ้นกระดานอันดับ และดูว่าเราอยู่อันดับที่เท่าไร <div class="row" style="margin-top:8px"><button class="btn acc" id="neLogin">🔑 เข้าสู่ระบบ</button></div></div>`;

    if(R&&R.score!=null) return `<div class="net-end" id="netEnd">🏆 ส่งผลขึ้นกระดานแล้ว · คะแนนรวม <b class="big">${R.score}</b>
      <div style="margin-top:4px">อันดับ <b>#${R.rankAll}</b> จาก ${R.totalAll} คน${R.rankRoom?` · ในห้อง ${esc(R.room)} อันดับ <b>#${R.rankRoom}</b> จาก ${R.totalRoom} คน`:''}</div>
      <div class="row" style="margin-top:8px"><button class="btn" id="neBoard">🏆 ดูกระดานอันดับ</button></div></div>`;

  function bindEnd(m){

    const b=m.querySelector('#neBoard'); if(b) b.onclick=()=>boardUI(S.netSent&&S.netSent.room||'ALL');

        S.netSent={score:r.score,rankAll:r.rankAll,totalAll:r.totalAll,rankRoom:r.rankRoom,totalRoom:r.totalRoom,room:code};
        save(); feed('end',`คะแนนรวม ${r.score}`);
        if(S.phase==='end') render();
      }).catch(e=>{ sending=false; const el=document.getElementById('netEnd'); if(el) el.innerHTML=`⚠ ส่งผลไม่ได้ (${esc(e.message)}) <button class="btn ghost" id="neRetry">ลองใหม่</button>`; const rt=document.getElementById('neRetry'); if(rt) rt.onclick=()=>render(); });
    }
  }

  /* ---------- หน้าหลัก ---------- */
  function homeHTML(){
    if(!avail()) return `<p class="note" style="text-align:center;margin-top:14px">🌐 ระบบออนไลน์ (เซฟบนคลาวด์ · ห้องเล่นพร้อมกัน · กระดานอันดับ) ยังไม่เปิดในลิงก์นี้ · ตอนนี้เล่นได้ปกติ เกมเซฟไว้ในเครื่อง</p>`;
    if(!me) return `<div class="net-card"><h3>🌐 เล่นออนไลน์</h3>
      <div class="net-feats"><span>☁ เซฟบนคลาวด์ เล่นต่อได้ทุกเครื่อง</span><span>👥 ห้องเล่นพร้อมกันกับเพื่อน</span><span>🏆 กระดานอันดับ</span></div>
      <div class="row"><button class="btn acc" id="hnLogin">🔑 เข้าสู่ระบบ / สร้างผู้เล่น</button><button class="btn ghost" id="hnBoard">🏆 ดูกระดานอันดับ</button></div></div>`;
    return `<div class="net-card"><h3>🌐 สวัสดี ${esc(me.name)}</h3>
      <div class="note" style="margin:0">${cloud?`☁ เซฟบนคลาวด์: <b>${esc(cloud.label)}</b> · ${ago(cloud.savedAt)}`:'☁ ยังไม่มีเซฟบนคลาวด์ เริ่มเล่นแล้วระบบจะบันทึกให้อัตโนมัติ'}${room?` · 👥 อยู่ในห้อง <b>${esc(room.code)}</b>`:''}</div>
      <div class="row">${cloud&&!cloud.ended?`<button class="btn acc" id="hnLoad">☁ เล่นต่อจากคลาวด์</button>`:''}
        <button class="btn" id="hnRoom">👥 ห้องเล่นพร้อมกัน</button><button class="btn" id="hnBoard">🏆 กระดานอันดับ</button><button class="btn ghost" id="hnOut">🚪 ออกจากระบบ</button></div></div>`;

  function paintChip(){

    c.innerHTML=me?`<button class="chip netchip" id="ncBtn"><span class="dot on"></span><b>${esc(me.name)}</b>${cs?` <span class="cs">${cs}</span>`:''}</button>`
                  :`<button class="chip netchip" id="ncBtn"><span class="dot"></span>🌐 เข้าสู่ระบบออนไลน์</button>`;
    c.querySelector('#ncBtn').onclick=()=>me?accountUI():loginUI();

  /* ---------- feed / โบนัส ---------- */
  const fq=[]; let fqBusy=false;
  function feed(kind,detail){ if(!room||!me) return; fq.push([kind,String(detail||'').slice(0,48)]); if(fq.length>6) fq.splice(0,fq.length-6); runFq(); }
  function runFq(){ if(fqBusy||!fq.length||!room||!me) return; fqBusy=true; const [k,d]=fq.shift();
    call('apiFeed',me.token,room.code,k,d).catch(()=>{}).then(()=>setTimeout(()=>{ fqBusy=false; runFq(); },1100)); }
  function bonusFor(id){ return BONUS_ACTS.includes(id)&&friendsOnline()>0; }

  function init(){
    paintChip();
    if(!avail()||!me) return;
    call('apiWho',me.token).then(r=>{
      if(!r.ok) return;
      cloud=r.cloud; paint(); if(!S) render();
      const rc=ss.get(RK); if(rc&&!room) call('apiRoomJoin',me.token,rc).then(j=>{ if(j.ok) enterRoom(j.code); else ss.set(RK,null); }).catch(()=>{});
    }).catch(()=>{});
  }
  return {avail,init,paint,paintChip,queueSave,feed,bonusFor,homeHTML,bindHome,endHTML,bindEnd,loginUI,boardUI,roomUI,accountUI,logout,roomBodyHTML,bindRoom,onlineN,
    get me(){ return me; }, get room(){ return room; }};
})();

(function(){

  const _log=log; log=function(t){ _log.apply(null,arguments); if(/หมดไฟ/.test(String(t))) NET.feed('burn',''); };

    try{ if(/^final\d/.test(type)&&S.exams[type]){ const g=ACAD.reduce((a,k)=>a+gradeOf(S.exams[type][k]),0)/ACAD.length; if(g>=3.5) NET.feed('gpa',`${g.toFixed(2)} (${TERM_NAME(+type.replace(/\D/g,''))})`); } }catch(e){}

  const _tc=tcasConfirm; tcasConfirm=function(fac,round){ const r=_tc.apply(null,arguments); NET.feed('tcas',`${fac} · ${String(round||'').split(' ').slice(0,2).join(' ')}`); return r; };

})();

const MOB=(()=>{

  function paintNav(){

      if(k==='passion'&&tab!=='passion'&&passKey()!==seenPass) return '<i class="bd dot"></i>';

          <div class="note" style="margin:0">${PROGRAMS[S.prog]?PROGRAMS[S.prog].name:''} · ${termLabel(S.month)}</div>
          <div class="note" style="margin:0">💾 เกมเซฟอัตโนมัติ${me?' · ☁ บันทึกบนคลาวด์ด้วย':''}</div></div></div>
        <div class="mmenu">
